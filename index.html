<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowSuite — Tu equipo de IA que nunca descansa</title>
<meta name="description" content="Agentes de IA que atienden, captan y cierran clientes 24/7. Sin contratar personal. Sin código. En marcha en 48h.">

<!-- Favicon real del repo -->
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/rodrigodiazv/Flowsuite_website/main/favicon.png">

<!-- Fonts: Plus Jakarta Sans (proven from previous premium build) + Syne for display -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESET + VARIABLES
   Design direction: Dark premium SaaS — ElevenLabs × Linear × Superhuman
   Background: ultra-dark navy, teal accent, purple secondary
   Differentiation: Flow avatar as the hero — she IS the product
============================================================ */
:root {
  --ink:    #02060F;
  --ink2:   #070D1A;
  --ink3:   #0C1424;
  --teal:   #00E5C8;
  --teal2:  #00BFA8;
  --purple: #7B5CF6;
  --purp2:  #9B7FF8;
  --red:    #FF4D6D;
  --white:  #FFFFFF;
  --g1:     #E8EDF5;
  --g2:     #9BA8BE;
  --g3:     #5C6B85;
  --border: rgba(255,255,255,0.07);
  --card:   rgba(255,255,255,0.035);
  --glow-t: 0 0 60px rgba(0,229,200,0.12);
  --glow-p: 0 0 60px rgba(123,92,246,0.15);
  --ff-d:   'Syne', sans-serif;
  --ff-b:   'Plus Jakarta Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html   { scroll-behavior: smooth; font-size: 16px; }
body   { background: var(--ink); color: var(--g1); font-family: var(--ff-b); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a      { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: var(--ff-b); border: none; background: none; }
ul     { list-style: none; }
img    { display: block; max-width: 100%; }

/* GRAIN OVERLAY */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
  opacity: 0.032;
}

/* GRID TEXTURE */
.has-grid {
  background-image:
    linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
  background-size: 72px 72px;
}

.container { max-width: 1160px; margin: 0 auto; padding: 0 28px; }

/* ============================================================
   TYPOGRAPHY HELPERS
============================================================ */
.tag {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--teal);
  background: rgba(0,229,200,.07); border: 1px solid rgba(0,229,200,.2);
  border-radius: 100px; padding: 6px 14px; margin-bottom: 22px;
}
.tag-dot { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; animation: pulse-dot 2s ease infinite; }

.h2 {
  font-family: var(--ff-d);
  font-size: clamp(2rem, 4.5vw, 3.2rem);
  font-weight: 800; line-height: 1.08; letter-spacing: -.03em;
  margin-bottom: 18px;
}
.h2 em { font-style: normal; color: var(--teal); }
.h2 strong { font-style: normal; color: var(--purp2); font-weight: 800; }

.lead { font-size: 1.08rem; color: var(--g2); line-height: 1.72; max-width: 560px; }

/* ============================================================
   BUTTONS
============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--ff-b); font-weight: 700; font-size: .94rem;
  padding: 14px 28px; border-radius: 12px;
  transition: all .22s ease; white-space: nowrap;
  cursor: pointer;
}
.btn-teal {
  background: var(--teal); color: var(--ink);
  box-shadow: 0 0 28px rgba(0,229,200,.28);
}
.btn-teal:hover { background: #1FFCD6; box-shadow: 0 0 48px rgba(0,229,200,.5); transform: translateY(-2px); }

.btn-outline {
  background: transparent; color: var(--g1);
  border: 1px solid var(--border);
}
.btn-outline:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.04); transform: translateY(-2px); }

.btn-purple {
  background: var(--purple); color: var(--white);
  box-shadow: 0 0 28px rgba(123,92,246,.28);
}
.btn-purple:hover { background: var(--purp2); box-shadow: 0 0 48px rgba(123,92,246,.5); transform: translateY(-2px); }

/* ============================================================
   HEADER
============================================================ */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 16px 0;
  transition: background .35s ease, border-color .35s ease, backdrop-filter .35s ease;
}
#header.scrolled {
  background: rgba(2,6,15,.9);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
}

.nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }

/* Logo */
.nav-logo { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
.nav-logo-img { height: 40px; width: auto; object-fit: contain; }
.nav-logo-text {
  font-family: var(--ff-d); font-weight: 800; font-size: 1.2rem;
  letter-spacing: -.02em; display: none;
  background: linear-gradient(135deg, var(--white) 30%, var(--teal));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

/* Nav links */
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links a { font-size: .88rem; font-weight: 500; color: var(--g3); transition: color .2s; }
.nav-links a:hover { color: var(--white); }

/* Language switcher — bulletproof implementation */
.lang-sw {
  display: flex; align-items: center; gap: 1px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  border-radius: 10px; padding: 3px; flex-shrink: 0;
}
.lbtn {
  font-family: var(--ff-b); font-size: .7rem; font-weight: 700;
  color: var(--g3); padding: 5px 10px; border-radius: 8px;
  transition: all .18s ease; cursor: pointer; letter-spacing: .04em;
  border: none; background: transparent;
}
.lbtn:hover { color: var(--white); }
.lbtn.on { background: var(--teal); color: var(--ink) !important; }

.nav-right { display: flex; align-items: center; gap: 12px; }

/* Hamburger */
.hbg { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 3px; }
.hbg span { display: block; width: 22px; height: 2px; background: var(--white); border-radius: 2px; transition: all .28s; }
.hbg.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hbg.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hbg.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile menu */
.mob-menu {
  display: none; position: fixed; top: 73px; left: 0; right: 0; z-index: 997;
  background: rgba(7,13,26,.98); backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border); padding: 20px 28px;
  flex-direction: column; gap: 2px;
}
.mob-menu.open { display: flex; }
.mob-menu a { font-size: 1rem; font-weight: 600; padding: 13px 0; border-bottom: 1px solid var(--border); color: var(--g1); }
.mob-lang { display: flex; gap: 6px; margin: 14px 0 6px; flex-wrap: wrap; }

/* ============================================================
   HERO — Split layout: copy left + Flow avatar right
============================================================ */
.hero {
  min-height: 100vh; display: flex; align-items: center;
  padding: 128px 0 80px; position: relative; overflow: hidden;
}

/* Ambient orbs */
.orb {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
  filter: blur(80px);
}
.orb-1 { width: 700px; height: 700px; top: -20%; right: -15%; background: radial-gradient(circle, rgba(123,92,246,.16) 0%, transparent 70%); }
.orb-2 { width: 500px; height: 500px; bottom: -10%; left: -10%; background: radial-gradient(circle, rgba(0,229,200,.1) 0%, transparent 70%); }
.orb-3 { width: 300px; height: 300px; top: 30%; left: 30%; background: radial-gradient(circle, rgba(123,92,246,.06) 0%, transparent 70%); }

.hero-inner {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center;
}

/* Hero left */
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(0,229,200,.07); border: 1px solid rgba(0,229,200,.22);
  border-radius: 100px; padding: 8px 16px;
  font-size: .8rem; font-weight: 700; color: var(--teal);
  margin-bottom: 30px;
  animation: fadeUp .6s ease both;
}
.hero-badge-dot { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; animation: pulse-dot 1.8s ease infinite; flex-shrink: 0; }

.hero-h1 {
  font-family: var(--ff-d);
  font-size: clamp(3rem, 5.5vw, 5rem);
  font-weight: 800; line-height: .98; letter-spacing: -.04em;
  margin-bottom: 26px;
  animation: fadeUp .6s .08s ease both;
}
.hero-h1 .line1 { display: block; color: var(--white); }
.hero-h1 .line2 {
  display: block;
  background: linear-gradient(120deg, var(--teal) 0%, var(--purp2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.hero-sub {
  font-size: 1.08rem; color: var(--g2); max-width: 480px;
  line-height: 1.72; margin-bottom: 38px;
  animation: fadeUp .6s .16s ease both;
}

.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 52px; animation: fadeUp .6s .24s ease both; }

.hero-stats {
  display: flex; flex-wrap: wrap; gap: 36px;
  padding-top: 36px; border-top: 1px solid var(--border);
  animation: fadeUp .6s .32s ease both;
}
.stat .n { font-family: var(--ff-d); font-size: 1.9rem; font-weight: 800; color: var(--teal); letter-spacing: -.03em; }
.stat .l { font-size: .78rem; color: var(--g3); margin-top: 1px; }

/* Hero right — Flow avatar */
.hero-right {
  position: relative; display: flex; justify-content: center;
  animation: fadeUp .7s .14s ease both;
}
.hero-right::before {
  content: '';
  position: absolute; inset: -20px;
  background: radial-gradient(ellipse at center, rgba(123,92,246,.14) 0%, transparent 65%);
  border-radius: 50%; pointer-events: none;
}

.flow-card {
  position: relative; z-index: 1;
  border-radius: 28px; overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(0,229,200,.1), var(--glow-p);
  max-width: 420px; width: 100%;
}
.flow-img {
  width: 100%; display: block;
  animation: float-y 6s ease-in-out infinite;
  object-fit: cover;
}

/* Floating badge: Flow is online */
.flow-live {
  position: absolute; bottom: 22px; left: -12px;
  background: rgba(7,13,26,.92); border: 1px solid rgba(0,229,200,.3);
  backdrop-filter: blur(16px); border-radius: 14px;
  padding: 12px 18px; display: flex; align-items: center; gap: 10px;
  z-index: 2; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  animation: float-y 6s ease-in-out infinite reverse;
}
.flow-live-dot { width: 10px; height: 10px; background: var(--teal); border-radius: 50%; flex-shrink: 0; animation: pulse-dot 1.8s ease infinite; }
.flow-live-name { font-family: var(--ff-d); font-size: .88rem; font-weight: 700; color: var(--white); }
.flow-live-sub { font-size: .7rem; color: var(--g3); margin-top: 1px; }

/* Floating stat badges */
.fb {
  position: absolute; z-index: 2;
  background: rgba(7,13,26,.9); border: 1px solid var(--border);
  backdrop-filter: blur(12px); border-radius: 12px;
  padding: 10px 14px; font-size: .76rem; font-weight: 600; color: var(--g1);
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  white-space: nowrap;
}
.fb-1 { top: 12%; right: -18px; animation: float-y 5s ease-in-out infinite .5s; }
.fb-2 { top: 42%; right: -22px; animation: float-y 5.5s ease-in-out infinite 1s; }

/* ============================================================
   LOGOS MARQUEE
============================================================ */
.marquee-wrap { padding: 32px 0; overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--ink2); }
.marquee-label { text-align: center; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--g3); margin-bottom: 22px; }
.marquee-track { display: flex; gap: 36px; align-items: center; animation: marquee 24s linear infinite; white-space: nowrap; }
.mpill { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.035); border: 1px solid var(--border); border-radius: 100px; padding: 8px 18px; font-size: .82rem; font-weight: 600; color: var(--g3); flex-shrink: 0; }

/* ============================================================
   VILLAIN — El problema (StoryBrand)
============================================================ */
.villain { padding: 96px 0; background: var(--ink2); }
.villain-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-top: 52px; }
.villain-card {
  background: rgba(255,77,109,.04); border: 1px solid rgba(255,77,109,.12);
  border-radius: 18px; padding: 32px 28px;
  transition: border-color .28s;
}
.villain-card:hover { border-color: rgba(255,77,109,.3); }
.vc-icon { font-size: 2rem; margin-bottom: 16px; }
.vc-title { font-family: var(--ff-d); font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; color: var(--white); }
.vc-desc { font-size: .88rem; color: var(--g2); line-height: 1.65; }

/* ============================================================
   BENEFITS
============================================================ */
.benefits { padding: 96px 0; }
.benefits-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 56px; }
.bcard {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 36px 28px;
  transition: border-color .28s, box-shadow .28s, transform .28s;
  position: relative; overflow: hidden;
}
.bcard::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,229,200,.03) 0%, transparent 60%);
  opacity: 0; transition: opacity .28s; pointer-events: none;
}
.bcard:hover { border-color: rgba(0,229,200,.22); box-shadow: 0 0 48px rgba(0,229,200,.08); transform: translateY(-4px); }
.bcard:hover::before { opacity: 1; }
.bicon { width: 48px; height: 48px; background: rgba(0,229,200,.08); border: 1px solid rgba(0,229,200,.18); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; margin-bottom: 20px; }
.btitle { font-family: var(--ff-d); font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; color: var(--white); }
.bdesc { font-size: .88rem; color: var(--g2); line-height: 1.65; }

/* ============================================================
   HOW IT WORKS
============================================================ */
.how { padding: 96px 0; background: var(--ink2); position: relative; overflow: hidden; }
.how::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 800px; height: 500px; background: radial-gradient(ellipse, rgba(123,92,246,.06) 0%, transparent 70%); pointer-events: none; }
.how-steps { display: grid; grid-template-columns: repeat(4,1fr); gap: 28px; margin-top: 56px; position: relative; z-index: 1; }
.how-steps::before { content: ''; position: absolute; top: 26px; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg,transparent, var(--purple), var(--teal), transparent); }
.step { text-align: center; padding: 0 8px; }
.step-n {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff-d); font-weight: 800; font-size: .95rem;
  margin: 0 auto 22px; position: relative;
  transition: transform .28s;
}
.step:hover .step-n { transform: scale(1.1); }
.step-n.t { background: rgba(0,229,200,.1); border: 2px solid var(--teal); color: var(--teal); }
.step-n.p { background: rgba(123,92,246,.1); border: 2px solid var(--purp2); color: var(--purp2); }
.step-title { font-family: var(--ff-d); font-size: 1rem; font-weight: 700; margin-bottom: 10px; color: var(--white); }
.step-desc { font-size: .85rem; color: var(--g2); line-height: 1.65; }

/* ============================================================
   DEMO — Flow en acción
============================================================ */
.demo { padding: 96px 0; }
.demo-inner {
  display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center;
}
.demo-text .h2 { margin-bottom: 20px; }
.demo-text .lead { margin-bottom: 32px; }

/* Mockup phone */
.phone-wrap { position: relative; max-width: 340px; margin: 0 auto; }
.phone {
  background: var(--ink3); border: 1px solid rgba(0,229,200,.15);
  border-radius: 28px; overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,.6), var(--glow-t);
}
.phone-header {
  background: rgba(0,229,200,.06); border-bottom: 1px solid rgba(0,229,200,.1);
  padding: 14px 18px; display: flex; align-items: center; gap: 12px;
}
.ph-avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--teal); }
.ph-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ph-name { font-family: var(--ff-d); font-size: .88rem; font-weight: 700; color: var(--white); }
.ph-status { font-size: .68rem; color: var(--teal); display: flex; align-items: center; gap: 5px; }
.ph-dot { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; animation: pulse-dot 1.8s ease infinite; }

/* Wave bars */
.voice-bar { padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.vb-label { font-size: .65rem; font-weight: 700; letter-spacing: .1em; color: var(--teal); }
.waves { display: flex; align-items: center; gap: 3px; height: 24px; }
.wave { width: 3px; background: var(--teal); border-radius: 3px; animation: wave-anim var(--d,0.8s) ease-in-out infinite alternate; }
.wave:nth-child(1)  { height: 6px;  --d: 0.7s; }
.wave:nth-child(2)  { height: 14px; --d: 0.5s; }
.wave:nth-child(3)  { height: 20px; --d: 0.9s; }
.wave:nth-child(4)  { height: 10px; --d: 0.6s; }
.wave:nth-child(5)  { height: 22px; --d: 0.4s; }
.wave:nth-child(6)  { height: 8px;  --d: 0.8s; }
.wave:nth-child(7)  { height: 18px; --d: 0.55s; }
.wave:nth-child(8)  { height: 12px; --d: 0.75s; }
.wave:nth-child(9)  { height: 20px; --d: 0.45s; }
.wave:nth-child(10) { height: 6px;  --d: 0.65s; }

/* Chat messages */
.chat { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
.msg { max-width: 82%; font-size: .8rem; line-height: 1.45; padding: 9px 13px; border-radius: 14px; }
.msg-flow { background: rgba(0,229,200,.1); border: 1px solid rgba(0,229,200,.15); color: var(--g1); border-radius: 4px 14px 14px 14px; align-self: flex-start; }
.msg-user { background: rgba(123,92,246,.15); border: 1px solid rgba(123,92,246,.2); color: var(--g1); border-radius: 14px 4px 14px 14px; align-self: flex-end; }
.typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; align-self: flex-start; }
.typing span { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; opacity: .4; animation: typing-dot .9s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

/* Floating demo badges */
.db { position: absolute; z-index: 2; background: rgba(7,13,26,.92);
